
name: Ki-Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build munch AOSP KSU
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          ref: beta-test
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache \
            curl flex git zip unzip \
            libelf-dev libssl-dev \
            libncurses-dev libncurses5-dev \
            device-tree-compiler \
            python3 python3-pip \
            rsync lz4 zstd \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Download ZyCromerZ Clang 16
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/zyc-clang" "$RUNNER_TEMP/clang"

          gh release download 16.0.6-20260510-release \
            --repo ZyCromerZ/Clang \
            --pattern '*.tar.gz' \
            --dir "$RUNNER_TEMP/clang"

          ARCHIVE=$(find "$RUNNER_TEMP/clang" \
            -maxdepth 1 -name '*.tar.gz' -print -quit)

          test -n "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$HOME/zyc-clang"

          if [ ! -x "$HOME/zyc-clang/bin/clang" ]; then
            CLANG_BIN=$(find "$HOME/zyc-clang" \
              -path '*/bin/clang' -print -quit)

            test -n "$CLANG_BIN"
            TOOLCHAIN_ROOT="${CLANG_BIN%/bin/clang}"
            ln -s "$TOOLCHAIN_ROOT/bin" "$HOME/zyc-clang/bin"
          fi

          echo "$HOME/zyc-clang/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Prepare Build Environment
        run: |
          chmod +x build.sh

          if [ ! -x tools/hostcc ]; then
            mkdir -p tools
            ln -sf "$(command -v gcc)" tools/hostcc
          fi

          echo "Checking toolchain..."
          clang --version
          aarch64-linux-gnu-ld --version
          arm-linux-gnueabi-gcc --version

      - name: Verify AnyKernel3 Access
        run: |
          echo "Setting up AnyKernel3..."
          if [ -d "../AnyKernel3" ]; then
          echo "Using local AnyKernel3 (../AnyKernel3)..."
          rm -rf anykernel/
          cp -r ../AnyKernel3 anykernel
          rm -f anykernel/MUNCH-* anykernel/*.zip 2>/dev/null || true
          else
          git clone https://github.com/kvsnr113/AnyKernel3 -b master --single-branch --depth=1 anykernel || \
          git clone https://github.com/osm0sis/AnyKernel3 -b master --single-branch --depth=1 anykernel
          fi

      
      - name: Download KernelSU
        run: |
          # Remove broken submodule reference from runner checkout only
          git update-index --force-remove KernelSU || true
          rm -rf KernelSU drivers/kernelsu

          # Clone the selected KernelSU fork
          git clone https://github.com/backslashxx/KernelSU.git KernelSU

          # Pin the exact commit
          git -C KernelSU checkout --detach a27e0c3d98fd79ab795293d73d5990a10b8731d8

          # Verify KernelSU source
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Makefile

          # Integrate into kernel tree
          mkdir -p drivers
          ln -s ../../KernelSU/kernel drivers/kernelsu

          echo "KernelSU integration ready!"
      
      - name: Compile Kernel
        shell: bash
        run: |
          set -o pipefail
          bash build.sh munch ksu aosp 2>&1 | tee build.log

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ki-Kernel-munch-AOSP-KSU
          if-no-files-found: warn
          retention-days: 14
          path: |
            *.zip
            release/*.zip
            build.log
            out/.config
            out/Module.symvers
            out/include/config/kernel.release
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/**/*.dtb
